background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ffffffff)
    font_size = 64
    font_family = Sans

    position = 0, 320
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/snugcode/Images/Mechanicus-Icon.png
    size = 180
    rounding = -1

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = SnugCode
    color = rgba(ffffffff)
    font_size = 28
    font_family = Sans

    position = 0, -115
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(ffffffaa)
    inner_color = rgba(00000088)
    font_color = rgb(ffffff)

    fade_on_empty = false
    rounding = 12

    position = 0, -180
    halign = center
    valign = center
}